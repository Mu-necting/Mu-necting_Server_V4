server:
  port: ${SERVER_PORT}

spring :
  application:
    name: munectingV4
  mvc:
    path match:
      matching-strategy: ant_path_matcher
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgresSQLDialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        jdbc:
          timezone: Asia/Seoul

  datasource:
    url: jdbc:${DATASOURCE}://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 3600

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
#      password: 1234


  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      path-pattern: "/**"

    auth:
      header: ${AUTH_HEADER:Authorization}
      prefix: ${AUTH_PREFIX:Bearer }

    oauth:
      kakao:
        public-key-info: https://kauth.kakao.com/.well-known/jwks.json
        issuer: https://kauth.kakao.com
        audience: ${KAKAO_APP_ID}}
      apple:
        public-key-url: https://appleid.apple.com/auth/keys
        issuer: https://appleid.apple.com
        audience: ${APPLE_APP_ID}
      google:
        client-id: ${GOOGLE_CLIENT_ID}

  servlet:
    multipart:
      maxFileSize: 3MB # 파일 하나의 최대 크기
      maxRequestSize: 10MB  # 한 번에 최대 업로드 가능 용량
      resolve-lazily: true


cloud:
  aws:
    s3:
      bucket: munecting
      path:
        profile-image: profileImage

    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_S3_ACCESS_KEY_ID}
      secretKey: ${AWS_S3_SECRET_ACCESS_KEY}

spotify:
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET_KEY}
  access:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

kakao-map:
  api-key: ${KAKAO_MAP_API_KEY}
