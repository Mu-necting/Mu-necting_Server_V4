#green
version: '3'
services:
  munecting-develop-api:
    build: .
    ports:
      - "8082:8080"
    container_name: spring-green
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - .env.common
      - .env.prod
    networks:
      - munecting-network

networks:
  munecting-network:
    external: true